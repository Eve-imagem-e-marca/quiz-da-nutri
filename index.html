<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dra. Ana Paula · Nutricionista</title>
<style>:root{--c:#9A6240;--c2:#F3E3DA;--bg:#FAF4EE;--ink:#3A2A22;--soft:#7A6A60;--line:#E6D6CA;--deep:#2F5D54}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font:italic 700 30px/1.2 Georgia,serif;margin:10px 0 12px;color:var(--deep)}
h2{font:700 21px/1.3 Georgia,serif;margin:18px 0 10px;color:var(--deep)}
p{margin:0 0 14px}.sub{color:var(--soft)}
.top{font:italic 17px Georgia,serif;color:var(--deep);text-align:center;margin:0 0 6px}
.btn{display:block;width:100%;min-height:58px;border-radius:16px;border:0;background:var(--c);color:#fff;font-weight:700;font-size:19px;font-family:inherit;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none;padding:16px}
.btn.sec{background:#fff;color:var(--c);border:2px solid var(--c)}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;margin:0 0 16px}
.card b{color:var(--deep)}
input,select,textarea{width:100%;font:inherit;font-size:19px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);margin:0 0 12px}
label{display:block;font-weight:700;margin:0 0 6px}
.aviso{font-size:15px;color:var(--soft);margin-top:14px}
.back{display:inline-block;color:var(--soft);font-size:17px;padding:8px 0;text-decoration:none}
footer{margin-top:auto;padding-top:24px;text-align:center;font-size:15px;color:var(--soft)}</style></head><body><main>

<p class="aviso">Conteúdo de orientação geral. Não substitui consulta com nutricionista.</p>
<footer>Feito por Eve, imagem e marca<br>Nutrindo Vidas</footer>
</main></body></html>
