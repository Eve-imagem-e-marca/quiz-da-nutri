<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz: o seu emagrecimento com leveza · Dra. Ana Paula</title>
<style>.orna{display:flex;justify-content:center;align-items:center;gap:8px;margin:6px 0 10px}.orna svg{display:block}
:root{--verde:#9A6240;--verde2:#F3E3DA;--bg:#FAF4EE;--ink:#3A2A22;--soft:#7A6A60;--line:#E6D6CA;--deep:#2F5D54}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font:italic 400 30px/1.2 Georgia,serif;margin:10px 0 12px;color:var(--deep)}
h2{font:700 23px/1.3 Georgia,serif;margin:8px 0 16px}
p{margin:0 0 14px}
.sub{color:var(--soft)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:0 0 20px}
.bar i{display:block;height:100%;background:var(--verde);transition:width .25s}
.opt{display:block;width:100%;text-align:left;min-height:60px;padding:14px 16px;margin:0 0 12px;border-radius:16px;border:2px solid var(--line);background:#fff;font:inherit;color:inherit;cursor:pointer}
.opt.on{border-color:var(--verde);background:var(--verde2);font-weight:700}
.btn{display:block;width:100%;min-height:58px;border-radius:16px;border:0;background:var(--verde);color:#fff;font-weight:500;font-size:18px;font-family:inherit;cursor:pointer;margin-top:8px;text-align:center;text-decoration:none;padding:16px}
.btn[disabled]{opacity:.4}
.btn.sec{background:#fff;color:var(--verde);border:2px solid var(--verde)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 16px}
.card b{color:var(--deep)}b,strong{font-weight:500}
ul{margin:0 0 6px;padding-left:22px}li{margin:0 0 8px}
.aviso{font-size:15px;color:var(--soft);margin-top:14px}
footer{margin-top:auto;padding-top:24px;text-align:center;font-size:15px;color:var(--soft)}
.top{font:italic 17px Georgia,serif;color:var(--deep);text-align:center;margin:0 0 6px}.back{background:none;border:0;color:var(--soft);font:inherit;font-size:17px;padding:8px 0;cursor:pointer}
</style>
</head>
<body>
<main><svg width="0" height="0" style="position:absolute"><defs><path id="lf" d="M0 0C3-3.6 8-4.4 12-3C8.4 0.8 3.4 2.2 0 0Z"/>
<symbol id="folha" viewBox="0 0 40 40"><g fill="none" stroke="#2F5D54" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 39C20 30 20.5 20 21 12"/>
<use href="#lf" transform="translate(20.2 31) rotate(-150) scale(.95)"/><use href="#lf" transform="translate(20.2 31) rotate(-32) scale(.95)"/>
<use href="#lf" transform="translate(20.5 23) rotate(-148) scale(.9)"/><use href="#lf" transform="translate(20.5 23) rotate(-34) scale(.9)"/>
<use href="#lf" transform="translate(20.8 16) rotate(-145) scale(.75)"/><use href="#lf" transform="translate(20.8 16) rotate(-37) scale(.75)"/>
<use href="#lf" transform="translate(21 12) rotate(-88) scale(.8)"/></g></symbol>
<symbol id="laranja" viewBox="0 0 40 40"><circle cx="20" cy="23" r="13" fill="#E08A3C"/><circle cx="20" cy="23" r="10" fill="none" stroke="#F6B572" stroke-width="1.5"/><path d="M20 23V13M20 23l8-4M20 23l8 4M20 23l-8-4M20 23l-8 4M20 23v10" stroke="#F6B572" stroke-width="1.2"/><g fill="none" stroke="#2F5D54" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5C20 8 20.5 6.5 21.5 5"/><path d="M21 7C23 3.8 27.5 3.2 30 4.6C27.5 7.6 23.5 8.2 21 7Z"/><path d="M21 7C20 4 17 2.8 14.5 3.6C15.4 6.4 18.4 7.6 21 7Z"/></g></symbol></defs></svg>
<p class="top">Dra. Ana Paula · Nutricionista</p><div id="tela"></div>
<footer>Feito por Eve, imagem e marca<br>Nutrindo Vidas</footer>
</main>
<script>
(function(){
// ====== PERSONALIZE AQUI (a nutri troca só estas linhas) ======
var CONFIG={
  nutri:"Dra. Ana Paula",
  whats:"5511970547136",
             // DDI + DDD + número, só números
  msgInicial:"Oi, Dra. Ana Paula! Fiz o quiz e quero começar o meu emagrecimento com leveza."
};
// ===============================================================

var Q=[
 {t:"Como costuma ser o seu café da manhã?",o:[["Como com calma, algo que me sustenta",0],["Pego algo rápido, quando dá",1],["Costumo pular",2]]},
 {t:"Quantas vezes na semana você cozinha ou prepara a sua comida?",o:[["Quase todos os dias",0],["Algumas vezes",1],["Quase nunca, peço ou compro pronto",2]]},
 {t:"E a água ao longo do dia?",o:[["Bebo bem, tenho o hábito",0],["Lembro só de vez em quando",1],["Esqueço quase sempre",2]]},
 {t:"Como é o seu horário das refeições?",o:[["Mais ou menos regular",0],["Muda bastante de dia para dia",1],["Fico muitas horas sem comer e depois exagero",2]]},
 {t:"Quando bate a vontade de beliscar, o que costuma acontecer?",o:[["Escolho com consciência",0],["Como o que estiver à mão",1],["Belisco sem perceber, no automático",2]]},
 {t:"O que você mais gostaria de melhorar agora?",o:[["Manter o que já faço bem",0],["Organizar a minha rotina",1],["Emagrecer sem sofrer e sem culpa",2]]}
];
var R=[
 {n:"Você já está no caminho",d:"Você já tem bons hábitos. Um olhar profissional ajuda a manter o que funciona e a ajustar os detalhes.",dicas:["Mantenha os horários que já funcionam","Planeje a semana para não perder o ritmo","Peça uma avaliação para afinar o que falta"]},
 {n:"Rotina corrida",d:"A sua rotina pede organização. Pequenos ajustes de planejamento mudam muito o seu dia.",dicas:["Escolha 1 dia para deixar refeições adiantadas","Leve um lanche simples na bolsa","Deixe uma garrafa de água sempre à vista"]},
 {n:"Comer no automático",d:"Muitas mulheres vivem assim, e tem jeito. O primeiro passo é perceber os seus gatilhos e criar uma rotina mais leve e gentil com você.",dicas:["Observe, sem se cobrar, quando você belisca mais","Faça as refeições sem tela, pelo menos uma vez por dia","Converse com a Dra. Ana Paula para montar um plano só seu"]}
];
var A={};var i=0;var T=document.getElementById("tela");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function inicio(){
 T.innerHTML='<h1>O seu emagrecimento com leveza</h1><p class="sub">6 perguntas rápidas, leva 1 minuto. Você recebe dicas para o seu momento, sem culpa e sem pressão.</p><button class="btn" id="go">Começar</button><p class="aviso">Este quiz é só uma orientação geral e não substitui uma consulta.</p>';
 document.getElementById("go").onclick=function(){i=0;A={};pergunta()};
}
function pergunta(){
 var q=Q[i],h='<div class="bar"><i style="width:'+Math.round(i/Q.length*100)+'%"></i></div><p class="sub">Pergunta '+(i+1)+' de '+Q.length+'</p><h2>'+esc(q.t)+'</h2>';
 q.o.forEach(function(o,k){h+='<button class="opt'+(A[i]===k?' on':'')+'" data-k="'+k+'">'+esc(o[0])+'</button>'});
 h+='<button class="btn" id="px"'+(A[i]===undefined?' disabled':'')+'>'+(i===Q.length-1?'Ver o meu resultado':'Continuar')+'</button>';
 if(i>0)h+='<button class="back" id="vl">← Voltar</button>';
 T.innerHTML=h;
 Array.prototype.forEach.call(T.querySelectorAll(".opt"),function(b){b.onclick=function(){A[i]=+b.getAttribute("data-k");pergunta()}});
 document.getElementById("px").onclick=function(){if(A[i]===undefined)return;if(i<Q.length-1){i++;pergunta()}else resultado()};
 var v=document.getElementById("vl");if(v)v.onclick=function(){i--;pergunta()};
}
function resultado(){
 var s=0;Q.forEach(function(q,k){s+=q.o[A[k]][1]});
 var r=s<=3?R[0]:s<=7?R[1]:R[2];
 var link="https://wa.me/"+CONFIG.whats+"?text="+encodeURIComponent(CONFIG.msgInicial+" Meu resultado: "+r.n+".");
 var h='<div class="bar"><i style="width:100%"></i></div><p class="sub">Seu resultado</p><h1>'+esc(r.n)+'</h1><div class="card"><p>'+esc(r.d)+'</p></div><div class="card"><p><b>3 dicas para começar</b></p><ul>';
 r.dicas.forEach(function(d){h+='<li>'+esc(d)+'</li>'});
 h+='</ul></div><a class="btn" href="'+link+'">Quero começar com a '+esc(CONFIG.nutri)+'</a><button class="btn sec" id="rf">Refazer o quiz</button><p class="aviso">Orientação geral, não substitui consulta com nutricionista. Nenhuma resposta é guardada ou enviada.</p>';
 T.innerHTML=h;
 document.getElementById("rf").onclick=inicio;
}
inicio();
})();
</script>
</body>
</html>
